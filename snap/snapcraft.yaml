name: loremgenerator
version: 2.6.15+57
description: Lorem Ipsum Generator
contact: xrayadamo@gmail.com
icon: snap/gui/loremgenerator.png
confinement: strict
base: core24
grade: stable
license: MIT
source-code: https://github.com/XRayAdams/loremgenerator-rs
issues: https://github.com/XRayAdams/loremgenerator-rs/issues
website: https://www.rayadams.app

platforms:
  amd64:
  arm64:
    
apps:
  loremgenerator:
    command: bin/loremgenerator
    common-id: app.rayadams.loremgenerator
    extensions: [gnome]
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11

adopt-info: loremgenerator

parts:
  loremgenerator:
    plugin: rust
    source: .
    rust-channel: stable
    parse-info: [snap/app.rayadams.loremgenerator.metainfo.xml]
    build-packages:
      - pkg-config
      - libgtk-4-dev
      - libadwaita-1-dev
      - gettext
  
  translations:
    plugin: nil
    source: po
    build-packages:
      - gettext
    after: [loremgenerator]
    override-build: |
      for po_file in *.po; do
        if [ -f "$po_file" ]; then
          lang=$(basename "$po_file" .po)
          locale_dir="$CRAFT_PART_INSTALL/usr/share/locale/$lang/LC_MESSAGES"
          mkdir -p "$locale_dir"
          msgfmt -o "$locale_dir/loremgenerator.mo" "$po_file"
          echo "Compiled translation for $lang"
        fi
      done
  
  static-assets:
    plugin: dump
    source: assets
    organize:
      '*': assets/
