[package]
name = "loremgenerator"
version = "2.5.10+50"
edition = "2024"
description = "A simple and free utility to generate standard Lorem Ipsum text."
license = "MIT"
repository = "https://github.com/XRayAdams/loremgenerator-rs"
copyright = "2025,26 Konstantin Adamov <xrayadamo@gmail.com>"
homepage = "https://github.com/XRayAdams/loremgenerator-rs"
keywords = ["lorem", "lorem ipsum", "generator", "lorem generator"]
categories = ["gui","utils"]
authors = ["Konstantin Adamov <xrayadamo@gmail.com>"]

[dependencies]
relm4 = { version = "0.10.0", features = ["libadwaita"] }
relm4-macros = { version = "0.10.0"}
relm4-components = "0.10.0"

gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_5"] }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
clap = { version = "4.5", features = ["derive"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
